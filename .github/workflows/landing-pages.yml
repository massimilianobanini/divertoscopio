name: Divertoscopio Landing — GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - landing.css
      - landing.js
      - testing/landing-page.test.mjs
      - testing/repository-stress.test.mjs
      - testing/instagram-launch.stress.test.mjs
      - assets/visual-hammer/DIVERTOSCOPIO-visual-hammer-lime.png
      - .github/workflows/landing-pages.yml
  pull_request:
    paths:
      - index.html
      - landing.css
      - landing.js
      - testing/landing-page.test.mjs
      - .github/workflows/landing-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: divertoscopio-landing-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify landing
        run: node testing/landing-page.test.mjs
      - name: Verify complete Divertoscopio framework
        run: node testing/repository-stress.test.mjs
  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare minimal static site
        shell: bash
        run: |
          mkdir -p _site/assets/visual-hammer
          cp index.html landing.css landing.js _site/
          cp assets/visual-hammer/DIVERTOSCOPIO-visual-hammer-lime.png _site/assets/visual-hammer/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/assets/visual-hammer/DIVERTOSCOPIO-visual-hammer-lime.png
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
